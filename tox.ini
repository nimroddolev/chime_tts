# Multi-version compatibility matrix.
#
# pytest-homeassistant-custom-component bundles one Home Assistant core version
# per release, so each env pins the plugin version to pin a representative HA
# release. The goal is not every HA patch release; it is a floor/current/latest
# sweep that catches:
#   - older supported installs still used by cautious upgraders
#   - the current release family most users are likely to be on
#   - the newest installable stack before users hit it in production
#
# CI runs the full matrix (see .github/workflows/tests.yml) and is the source
# of truth. Locally, tox only runs envs for interpreters already installed.
#
# To extend the matrix, add a new env with the plugin version that ships the HA
# release you want to cover. Plugin patch numbers track HA releases; check:
# https://github.com/MatthewFlamm/pytest-homeassistant-custom-component/releases

[tox]
envlist = py312-hafloor, py313-hacurrent, py314-halatest
skip_missing_interpreters = true

[testenv]
deps =
    pydub
    aiofiles
    mutagen
    ha-ffmpeg
    py312-hafloor: pytest-homeassistant-custom-component==0.13.190
    py313-hacurrent: pytest-homeassistant-custom-component==0.13.200
    py314-halatest: pytest-homeassistant-custom-component==0.13.205
commands =
    pytest tests/ --cov=custom_components/chime_tts --cov-report=term-missing {posargs}

[testenv:lint]
deps = ruff==0.8.4
commands =
    ruff check custom_components/chime_tts tests
    ruff format --check custom_components/chime_tts tests

[testenv:type]
deps =
    mypy
    pytest-homeassistant-custom-component
commands = mypy custom_components/chime_tts
